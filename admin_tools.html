<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A7C90">

<title>Outils administrateur</title>

<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="home.css?v=3">

<style>

.back-btn{
  flex:none;
  width:48px;
  height:48px;
  margin:0;
  padding:0;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
}

.back-btn:hover{
  border-color:#BFD8DB;
}

.back-btn svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

</style>
</head>

<body>

<main class="card home-card">

  <header class="home-header">
    <button class="back-btn" onclick="history.back()" aria-label="Retour">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div>
      <h1 class="home-title">Outils administrateur</h1>
      <p class="home-subtitle">Gestion et création des programmes</p>
    </div>
  </header>

  <nav class="home-grid" aria-label="Outils">
    <button class="home-box" onclick="location.href='programmes_admin.html'">
      <span class="box-icon"><svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 12h6M9 16h6"/></svg></span>
      <span class="box-text"><strong>Programmes</strong><small>Voir et modifier les programmes</small></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="home-box" onclick="openProgrammeKine()">
      <span class="box-icon"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>
      <span class="box-text"><strong>Programme kiné</strong><small>Créer un nouveau programme</small></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="home-box" onclick="location.href='programmescourse.html'">
      <span class="box-icon"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg></span>
      <span class="box-text"><strong>Programme course</strong><small>Séances de course à pied</small></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="home-box" onclick="location.href='admin_exercises.html'">
      <span class="box-icon"><svg viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></svg></span>
      <span class="box-text"><strong>Gestion JSON</strong><small>Base d’exercices</small></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="home-box" onclick="location.href='exercises/glossary.html'">
      <span class="box-icon"><svg viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg></span>
      <span class="box-text"><strong>Glossaire exercices</strong><small>Toutes les fiches exercices</small></span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </nav>

</main>

<script>

if(
localStorage.getItem("admin_ok")
!== "true"
){
  window.location.href =
  "login.html";
}

</script>

<script>

function openProgrammeKine(){

  localStorage.removeItem("programme_temp");
  localStorage.removeItem("current_programme");
  localStorage.removeItem("edit_programme");
  localStorage.removeItem("pathologie");
  localStorage.removeItem("patho_data");
  localStorage.removeItem("pathologie_nom");
  localStorage.removeItem("programmeCopie");


  localStorage.setItem(
    "forceProgrammeKine",
    "1"
  );


  location.href =
  "config.html?v=" + Date.now();

}

if(
localStorage.getItem("admin_ok")
!== "true"
){
  window.location.href =
  "login.html";
}

</script>

</body>
</html>
